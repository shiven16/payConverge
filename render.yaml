services:
  - type: web
    name: payconverge
    runtime: docker
    region: singapore
    dockerCommand: sh -c "node dist/src/migrate.js && node dist/src/server.js"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payconverge-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: WEBHOOK_SIGNING_KEY
        generateValue: true
      - key: AUTHORITY_MODE
        value: mock
      - key: HYPERSWITCH_BASE_URL
        value: https://sandbox.hyperswitch.io
      - key: HYPERSWITCH_API_KEY
        sync: false
      - key: STUCK_AFTER_SECONDS
        value: "900"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "5"
      - key: RUN_BACKGROUND_PROCESSES
        value: "true"

databases:
  - name: payconverge-db
    databaseName: convergence
    user: postgres
    region: singapore
    plan: free
