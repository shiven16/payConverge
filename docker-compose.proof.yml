services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convergence
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convergence"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - proofdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
      PORT: "3000"
      WEBHOOK_SIGNING_KEY: dev_webhook_secret
      AUTHORITY_MODE: mock
      HYPERSWITCH_BASE_URL: https://sandbox.hyperswitch.io
      HYPERSWITCH_API_KEY: ""
      STUCK_AFTER_SECONDS: "1"
      OUTBOX_MAX_ATTEMPTS: "5"
      RUN_BACKGROUND_PROCESSES: "0"
    ports:
      - "3001:3000"
    command: sh -c "node dist/src/migrate.js && node dist/src/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  worker:
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
      OUTBOX_MAX_ATTEMPTS: "5"
      ORDER_SERVICE_MODE: ok
      INVENTORY_SERVICE_MODE: ok
      NOTIFIER_SERVICE_MODE: ok
    command: ["node", "dist/src/worker.js"]
  sweeper:
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
      STUCK_AFTER_SECONDS: "1"
    command: ["node", "dist/src/sweeper.js"]
volumes:
  proofdata:
