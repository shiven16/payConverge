services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convergence
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convergence"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
    ports:
      - "3000:3000"
    command: sh -c "node dist/src/migrate.js && node dist/src/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  worker:
    build: .
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
    command: ["node", "dist/src/worker.js"]
  sweeper:
    build: .
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/convergence
    command: ["node", "dist/src/sweeper.js"]
volumes:
  pgdata:
